<!-- Scripting for Tabs and Dual-Panel Charts -->
    <script>
        let chartsInitialized = false;

        function switchTab(tabId, event) {
            const sections = document.querySelectorAll('.tab-content');
            sections.forEach(sec => sec.classList.remove('active'));

            const buttons = document.querySelectorAll('.nav-links button');
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');

            // If user clicks MERRA-2 tab and charts haven't loaded yet, initialize them
            if (tabId === 'merra2' && !chartsInitialized) {
                loadMerra2Data();
            }
        }

        function loadMerra2Data() {
            const container = document.getElementById('merra2-data-container');
            
            fetch('data/jodhpur_merra2.json')
                .then(response => {
                    if (!response.ok) throw new Error("Data file not found");
                    return response.json();
                })
                .then(data => {
                    chartsInitialized = true;
                    const latest = data.latest;
                    const formattedDate = new Date(latest.date).toLocaleDateString();

                    container.innerHTML = `
                        <div style="background: white; padding: 1.5rem; border: 1px solid var(--border-color); border-radius: 8px; margin-top: 1rem;">
                            <h3 style="color: var(--primary-brown); margin-bottom: 1rem;">${data.location}</h3>
                            <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
                                <div>
                                    <span style="font-size: 0.9rem; color: var(--text-light);">Latest AOD (550nm)</span>
                                    <div style="font-size: 2.2rem; font-weight: bold; color: #8b5a2b;">${latest.aod_55.toFixed(3)}</div>
                                </div>
                                <div>
                                    <span style="font-size: 0.9rem; color: var(--text-light);">Estimated PM2.5</span>
                                    <div style="font-size: 2.2rem; font-weight: bold; color: #d32f2f;">${latest.pm25_total.toFixed(1)} µg/m³</div>
                                </div>
                                <div>
                                    <span style="font-size: 0.9rem; color: var(--text-light);">Temperature</span>
                                    <div style="font-size: 1.5rem; font-weight: 500;">${latest.temperature_2m.toFixed(1)} °C</div>
                                </div>
                                <div>
                                    <span style="font-size: 0.9rem; color: var(--text-light);">Wind Speed</span>
                                    <div style="font-size: 1.5rem; font-weight: 500;">${latest.wind_speed_10m.toFixed(1)} m/s</div>
                                </div>
                            </div>
                            <p style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-light);">
                                Snapshot Date: <strong>${formattedDate}</strong>
                            </p>
                        </div>
                    `;

                    const labels = data.history.map(item => new Date(item.date).toLocaleDateString(undefined, {month: 'short', day: 'numeric'}));
                    
                    // Panel 1: AOD Line Chart
                    const ctx1 = document.getElementById('merra2Chart').getContext('2d');
                    new Chart(ctx1, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Aerosol Optical Depth (550 nm)',
                                data: data.history.map(item => item.aod_55),
                                borderColor: '#8b5a2b',
                                backgroundColor: 'rgba(139, 90, 43, 0.1)',
                                borderWidth: 2,
                                tension: 0.2,
                                fill: true
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                x: { title: { display: true, text: 'Date' } },
                                y: { title: { display: true, text: 'AOD' }, beginAtZero: true }
                            }
                        }
                    });

                    // Panel 2: Stacked Area Concentration Chart
                    const ctx2 = document.getElementById('pm25StackedChart').getContext('2d');
                    new Chart(ctx2, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: 'Dust (DUSMASS25)',
                                    data: data.history.map(item => item.dust_pm25),
                                    borderColor: '#d4a373',
                                    backgroundColor: 'rgba(212, 163, 115, 0.6)',
                                    fill: true,
                                    tension: 0.2
                                },
                                {
                                    label: 'Sulfate (SO4 Adjusted)',
                                    data: data.history.map(item => item.so4_mass),
                                    borderColor: '#457b9d',
                                    backgroundColor: 'rgba(69, 123, 157, 0.6)',
                                    fill: true,
                                    tension: 0.2
                                },
                                {
                                    label: 'Organic Carbon (OCSMASS)',
                                    data: data.history.map(item => item.oc_mass),
                                    borderColor: '#e07a5f',
                                    backgroundColor: 'rgba(224, 122, 95, 0.6)',
                                    fill: true,
                                    tension: 0.2
                                },
                                {
                                    label: 'Black Carbon (BCSMASS)',
                                    data: data.history.map(item => item.bc_mass),
                                    borderColor: '#212529',
                                    backgroundColor: 'rgba(33, 37, 41, 0.6)',
                                    fill: true,
                                    tension: 0.2
                                },
                                {
                                    label: 'Sea Salt (SSSMASS25)',
                                    data: data.history.map(item => item.ss_pm25),
                                    borderColor: '#a8dadc',
                                    backgroundColor: 'rgba(168, 218, 220, 0.6)',
                                    fill: true,
                                    tension: 0.2
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                tooltip: { mode: 'index', intersect: false }
                            },
                            scales: {
                                x: { stacked: true, title: { display: true, text: 'Date' } },
                                y: { stacked: true, title: { display: true, text: 'Concentration (µg/m³)' }, beginAtZero: true }
                            }
                        }
                    });
                })
                .catch(error => {
                    container.innerHTML = `<p style="color: #666;">Data file loading... Make sure your GitHub Action has successfully run at least once to generate <code>data/jodhpur_merra2.json</code>.</p>`;
                    console.error(error);
                });
        }
    </script>
