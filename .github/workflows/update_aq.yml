name: Update Daily AQ Data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run AQ fetch script
        run: python fetch_aq.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data/jodhpur_aq.json
          
          # Check if there are staged changes; commit and push only if changes exist
          git diff --staged --quiet || (git commit -m "Automated daily AQ data update" && git push origin HEAD:${{ github.ref_name }})
