name: Update CERES Data Weekly

on:
  schedule:
    - cron: '0 2 * * 1' # Runs every Monday at 02:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run CERES fetch script
        run: python fetch_ceres.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data/jodhpur_ceres.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated CERES data update" && git push)
